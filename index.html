<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AboutApps — Simple, Clear App Pages</title>
  <meta name="description" content="AboutApps — short description of your project/company. Replace with a real summary." />
  <link rel="canonical" href="https://aboutapps.github.io/" />

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="AboutApps" />
  <meta property="og:title" content="AboutApps — Simple, Clear App Pages" />
  <meta property="og:description" content="AboutApps — short description of your project/company. Replace with a real summary." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aboutapps.github.io/" />
  <meta property="og:image" content="images/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Theme/color -->
  <meta name="theme-color" content="#0a84ff" />

  <!-- Minimal critical styles (inline for faster first paint) -->
  <style>
    :root{--bg:#fff;--fg:#0b1220;--muted:#6b7280;--accent:#0a84ff}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:var(--fg);background:var(--bg);line-height:1.5}
    a{color:var(--accent);text-decoration:none}
    header,main,footer{max-width:1100px;margin:0 auto;padding:1rem}
    .site-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
    .brand{font-weight:700;letter-spacing:0.2px}
    nav a{margin-left:1rem;font-size:0.95rem;color:var(--muted)}
    .hero{padding:3rem 1rem;text-align:center}
    .hero h1{margin:0 0 0.5rem;font-size:clamp(1.5rem,4vw,2.25rem)}
    .hero p{margin:0 0 1.25rem;color:var(--muted)}
    .cta{display:inline-block;padding:.6rem 1rem;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;padding:2rem 1rem}
    .card{border:1px solid #e6e9ee;border-radius:12px;padding:1rem;background:#fff}
    footer{padding:2rem 1rem;color:var(--muted);font-size:.9rem;text-align:center}
    /* Focus styles for keyboard users */
    :focus{outline:2px solid #005fcc;outline-offset:3px}
    .skip-link{position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden}
    .skip-link:focus{left:8px;top:8px;width:auto;height:auto;padding:.3rem .6rem;background:#000;color:#fff;border-radius:4px}
    @media (min-width:700px){ .hero{padding:4rem 1rem} }
  </style>

  <!-- Structured data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AboutApps",
    "url": "https://aboutapps.github.io/",
    "description": "AboutApps — short description of your project/company."
  }
  </script>
</head>
<body>

about apps.
  
</body>
</html>
