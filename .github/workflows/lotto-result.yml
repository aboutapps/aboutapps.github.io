name: Lotto Result Weekly

on:
  schedule:
    - cron: '0 0 * * 1'     # 매주 월요일 KST 오전 9시 (UTC 00:00)
  workflow_dispatch:

permissions:
  contents: write   # data.js 커밋
  actions: write    # 배포 워크플로 트리거

concurrency:
  group: lotto-result
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Build lotto result data
        run: python lotto_result/build.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_result/data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "chore(lotto_result): $(date -u -d '+9 hours' +%Y-%m-%d) 당첨 결과 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 트리거하지 않으므로 Pages 배포를 직접 호출
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape-and-deploy.yml --ref ${{ github.ref_name }}
